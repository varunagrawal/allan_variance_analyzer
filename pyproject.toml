[tool.poetry]
name = "allan_variance"
version = "1.0.0"
description = "Tools for Allan Variance Analysis"

license = "BSD 3-Clause License"

authors = ["Varun Agrawal <varunagrawal@gatech.edu>"]

readme = './README.md' # Markdown files are supported

repository = "https://github.com/varunagrawal/allan_variance"
homepage = "https://github.com/varunagrawal/allan_variance"

keywords = ['Research', 'Inertial', 'Allan Variance']

packages = [{ include = "allan_variance" }]
exclude = ["config", "ros", "ros2", "simulator"]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "*"
jax = "^0.4.38"
matplotlib = "*"
scipy = "*"
setuptools = "^75.1.0"
pyaml = "^21.10.1"
attrdict = "^2.0.1"
tqdm = "^4.62.2"
loguru = "^0.6.0"
rosbags = "^0.10.4"

[tool.poetry.dev-dependencies]
build = "^0.7.0"
pytest = "^7.1.1"
pylint = "^2.13.2"

[tool.poetry.scripts]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
