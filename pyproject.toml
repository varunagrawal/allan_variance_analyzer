[tool.poetry]
name = "allan_variance"
version = "1.0.0"
description = "Tools for Allan Variance Analysis"

license = "BSD 3-Clause License"

authors = [
    "Varun Agrawal < varunagrawal@gatech.edu>"]

readme = './README.md'  # Markdown files are supported

repository = "https://github.com/varunagrawal/allan_variance"
homepage = "https://github.com/varunagrawal/allan_variance"

keywords = ['Research', 'Inertial', 'Allan Variance']

[tool.poetry.dependencies]
python = "^3.8"
numpy = "*"
matplotlib = "*"
scipy = "*"
setuptools = "^46.1.3"
pyaml = "^21.10.1"
attrdict = "^2.0.1"
tqdm = "^4.62.2"
loguru = "^0.6.0"

[tool.poetry.dev-dependencies]
build = "^0.7.0"
pytest = "^7.1.1"
pylint = "^2.13.2"

[tool.poetry.scripts]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"